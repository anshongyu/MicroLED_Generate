[project]
name = "pyproject"
version = "0.1.0"
description = "Generate centered MicroLED source arrays as Ansys Speos Lightboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansys-speos-core[graphics]>=0.9.2",
    "pillow>=12.3.0",
    "pyside6>=6.11.2",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
